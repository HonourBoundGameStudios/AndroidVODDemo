[versions]
activityCompose = "1.10.1"                          # Activity Compose is a library that provides a set of APIs to integrate Jetpack Compose with the Android Activity lifecycle.
agp = "8.9.3"                                       # Android Gradle Plugin (AGP) is a plugin for the Gradle build system that provides support for building Android applications.
coilCompose = "2.5.0"                               # Coil is an image loading library for Android backed by Kotlin Coroutines.
composeBom = "2025.05.00"                           # The Compose BOM (Bill of Materials) is a Gradle dependency that allows you to manage the versions of all Jetpack Compose libraries in a single place.
coreKtx = "1.16.0"                                  # Android KTX is a set of Kotlin extensions that make it easier to use Android APIs in a more idiomatic way.
espressoCore = "3.6.1"                              # Espresso is a testing framework for Android that provides APIs to write UI tests.
junit = "1.2.1"                                     # JUnit is a popular testing framework for Java and Kotlin.
kotlin = "2.0.21"                                   # Kotlin is a modern programming language that is fully interoperable with Java and is the preferred language for Android development.
kotlinxCoroutinesAndroid = "1.9.0"                  # Kotlin Coroutines is a library that provides support for asynchronous programming in Kotlin.
kotlinxSerializationJson = "1.7.3"                  # Kotlin Serialization is a library for serializing and deserializing Kotlin objects to and from various formats, including JSON.
lifecycleRuntimeKtx = "2.9.0"                       # Android Lifecycle is a set of components that help manage the lifecycle of Android components, such as Activities and Fragments.
lifecycleViewmodelCompose = "2.9.0"                 # ViewModel is a component that is designed to store and manage UI-related data in a lifecycle-conscious way.
loggingInterceptor = "4.12.0"                       # OkHttp Logging Interceptor is a library that provides an interceptor for logging HTTP requests and responses in OkHttp.
media3 = "1.7.1"                                    # Media3 is a library for media playback and streaming in Android applications.
media3CommonKtx = "1.7.1"                           # Media3 Common KTX is a set of Kotlin extensions for the Media3 library that make it easier to use in Kotlin applications.
media3Exoplayer = "1.7.1"                           # ExoPlayer is a media player library for Android that provides support for playing audio and video content.
media3Ui = "1.7.1"                                  # Media3 UI is a library that provides UI components for media playback in Android applications.
navigationComposeVersion = "2.9.0"                  # Navigation Compose is a library that provides a set of APIs to implement navigation in Jetpack Compose applications.
retrofit = "2.9.0"                                  # Retrofit is a type-safe HTTP client for Android and Java that makes it easy to consume RESTful web services.
retrofit2KotlinxSerializationConverter = "1.0.0"    # Retrofit2 Kotlinx Serialization Converter is a library that provides a converter for using Kotlin Serialization with Retrofit.

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-media3-common-ktx = { group = "androidx.media3", name = "media3-common-ktx", version.ref = "media3CommonKtx" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3Ui" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationComposeVersion" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
material3 = { module = "androidx.compose.material3:material3" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit2-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit2KotlinxSerializationConverter" }
ui = { module = "androidx.compose.ui:ui" }
ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinserialisation = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

